<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - syahmiaof</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .profile-card {
            background-color: #1e1e1e;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid #333;
        }

        .profile-card h1 {
            color: #ffffff;
            font-size: 2rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .role {
            color: #4da6ff;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 0.85rem;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 20px;
            margin-bottom: 12px;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .skill-tag {
            background-color: #2c2c2c;
            border: 1px solid #444;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #66ff99;
            transition: background-color 0.3s;
        }

        .skill-tag:hover {
            background-color: #3d3d3d;
        }

        .fun-fact {
            background-color: #252525;
            padding: 15px;
            border-radius: 8px;
            font-style: italic;
            font-size: 0.95rem;
            color: #cccccc;
            border-left: 4px solid #ffaa00;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <h1>syahmiaof</h1>
        <div class="role">DevOps Engineer Junior</div>

        <div class="section-title">Kemahiran</div>
        <div class="skills">
            <span class="skill-tag">Linux</span>
            <span class="skill-tag">Git</span>
            <span class="skill-tag">Docker</span>
            <span class="skill-tag">Network</span>
        </div>

        <div class="section-title">Fakta Menarik</div>
        <div class="fun-fact">
            💡 Fast Learner
        </div>
    </div>

</body>
</html>
